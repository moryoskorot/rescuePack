<svg xmlns="http://www.w3.org/2000/svg" width="750" height="360" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Firefighter rank progression</title>
  <desc id="desc">Ten red and gold firefighter rank badges progress from Rookie to Supreme Chief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#123e78"/><stop offset="1" stop-color="#08234d"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="720" rx="42" fill="url(#bg)"/>
  <text x="750" y="68" fill="#ffe586" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900">FIREFIGHTER RANK PATH</text>
  <text x="750" y="108" fill="#d9eeff" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Grow from Rookie to Supreme Chief</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(35 140)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">1 · ROOKIE</text><image href="01-rookie.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(330 140)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">2 · EMBER SCOUT</text><image href="02-ember-scout.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(625 140)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">3 · HOSE HERO</text><image href="03-hose-hero.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(920 140)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">4 · FIREFIGHTER</text><image href="04-firefighter.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(1215 140)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">5 · BLAZE RUNNER</text><image href="05-blaze-runner.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(35 435)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">6 · FIRE GUARD</text><image href="06-fire-guard.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(330 435)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">7 · STATION CAPTAIN</text><image href="07-station-captain.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(625 435)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">8 · BATTALION CHIEF</text><image href="08-battalion-chief.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(920 435)"><rect width="250" height="245" rx="25" fill="#1a5595" stroke="#fff4c7" stroke-width="3"/><text x="125" y="35" fill="#ffe586" font-size="20" font-weight="900">9 · DEPUTY CHIEF</text><image href="09-deputy-chief.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
    <g transform="translate(1215 435)"><rect width="250" height="245" rx="25" fill="#ef4d3f" stroke="#fff4c7" stroke-width="4"/><text x="125" y="35" fill="#fff4c7" font-size="20" font-weight="900">10 · SUPREME CHIEF</text><image href="10-supreme-chief.png" x="35" y="44" width="180" height="160" preserveAspectRatio="xMidYMid meet"/></g>
  </g>
</svg>
